# Nginx server block for omnipathmarketing.com (HTTP first — certbot will rewrite to HTTPS).
# Drop into /etc/nginx/sites-available/omnipathmarketing.com and symlink to sites-enabled/.

# Redirect www to apex (and vice versa) — pick ONE canonical.
# We default to apex (omnipathmarketing.com) and 301 www to it.
server {
    listen 80;
    listen [::]:80;
    server_name www.omnipathmarketing.com;

    location / {
        return 301 https://omnipathmarketing.com$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name omnipathmarketing.com;

    # ACME challenge (Let's Encrypt) — keep this before the location / block.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # For now, just proxy to Next.js on :3000. Certbot will replace this server block
    # with the HTTPS version after running `certbot --nginx -d omnipathmarketing.com`.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Optional: gzip text assets
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
        gzip_min_length 1024;
    }

    # Static asset cache (Next.js writes hashed files under /_next/static)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Audit PDF (if you ever serve one directly without email)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 90s; # audits can be slow (Puppeteer)
    }
}
