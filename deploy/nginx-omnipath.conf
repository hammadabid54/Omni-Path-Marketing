# Omni Path Marketing — Nginx vhost.
# Routes omnipathmarketing.com / www.omnipathmarketing.com → Next.js on :3000.
# Will be upgraded to HTTPS by `certbot --nginx -d omnipathmarketing.com -d www.omnipathmarketing.com`.

server {
    listen 80;
    listen [::]:80;
    server_name omnipathmarketing.com www.omnipathmarketing.com;

    # ACME challenge (Let's Encrypt). Certbot will replace this with the HTTPS block.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Static cache for hashed assets (Next.js writes them under /_next/static).
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Audit / contact API — give it more time (Puppeteer can be slow).
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Everything else.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Slightly longer timeouts for any slow Next.js routes.
        proxy_connect_timeout 30s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Gzip text assets.
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Logs.
    access_log /var/log/nginx/omnipath.access.log;
    error_log  /var/log/nginx/omnipath.error.log;
}
